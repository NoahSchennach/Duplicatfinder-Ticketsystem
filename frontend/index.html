<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <!-- Frameworks -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ldbar/dist/ldbar.min.css">
  <link rel="stylesheet" href="style.css">

  <script defer src="app.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="#"></a>
      <img src="/frontend/img/HTL-Logo.png" alt="Logo" width="140">
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hidden hero-section py-5 text-center text-white">
    <div class="container">
      <h1>Duplicatefinder</h1>
      <p>Dieser Duplicatefinder analysiert automatisch eingehende Tickets und prüft sie auf inhaltliche Überschneidungen.</p>
    </div>
  </section>

  <!-- Results Grid -->
  <main class="hidden">
    <div class="container pb-5">
      <div class="row g-4" id="resultsContainer"></div>
    </div>
  </main>

  <footer>© HTL Reutte – Duplicatefinder Dashboard</footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ldbar/dist/ldbar.min.js"></script>

  <!-- Loading Bar -->
  <script src="/frontend/loading-bar/dist/loading-bar.min.js"></script>

  <script>
    // Funktion zum Rendern eines Tickets
    function renderResult(ticket1, ticket2, similarity) {
  const container = document.getElementById("resultsContainer");

  const col = document.createElement("div");
  col.className = "col-md-4 mb-3 hidden"; // Start mit hidden
  const barId = "bar-" + Math.floor(Math.random() * 1000000);

  col.innerHTML = `
    <div class="card text-center shadow-sm">
      <div class="card-body">
        <h6 class="card-title">${ticket1} : ${ticket2}</h6>
        <div id="${barId}" class="ldBar label-center mt-2" data-preset="circle"></div>
        <p class="mt-2"><strong>${similarity}%</strong></p>
      </div>
    </div>
  `;
  container.appendChild(col);

  const bar = new ldBar(`#${barId}`);
  bar.set(similarity);

  // Beobachten, damit Animation beim Scrollen startet
  observer.observe(col);
}




  // Funktion zum Laden der Tickets vom Backend
  function loadTickets() {
  fetch("http://127.0.0.1:8000/api/Duplicates")
    .then(response => response.json())
    .then(data => {
      console.log("Daten vom Backend:", data);

        data.forEach((d, index) => {
          setTimeout(() => {
            renderResult(d.title1, d.title2, d.similarity);
          }, index * 200); // 200ms Abstand zwischen den Karten
        });
      })
      .catch(error => console.error("Fehler beim Laden der Tickets:", error));
}


    // Beim Laden der Seite Tickets abrufen
    window.addEventListener("DOMContentLoaded", loadTickets);
  </script>


  

</body>
</html>
